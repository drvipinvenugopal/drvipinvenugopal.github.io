name: Update Scholar metrics

on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday, 03:30 UTC
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch numbers from Google Scholar
        run: python3 scripts/update_scholar.py

      - name: Commit if the numbers changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scholar.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Update Scholar metrics"
            git push
          fi
